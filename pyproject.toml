[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ages-environment"
version = "0.1.0"
description = "Ambiente local de Oracle of Ages para controle humano e futura integração de agentes"
requires-python = ">=3.10"
dependencies = ["pyboy==2.8.1", "Pillow==13.0.0"]

[project.optional-dependencies]
build-rom = ["PyYAML==6.0.3"]
laya = ["laya==0.5.0"]

[project.scripts]
zelda-env = "zelda_env.__main__:main"

[tool.setuptools.packages.find]
include = ["zelda_env*"]
